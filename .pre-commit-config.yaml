# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_language_version:
  # force all unspecified python hooks to run python3
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: [ --unittest ]
      - id: trailing-whitespace

  - repo: https://github.com/asottile/reorder_python_imports
    rev: v3.16.0
    hooks:
      - id: reorder-python-imports
        args: [ --py313-plus ]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies: [ '--extra-index-url=https://download.pytorch.org/whl/cu132', click, keras, numpy, types-requests, torch, wandb ]

  - repo: local
    hooks:
      - id: unittest
        name: unittest
        entry: env TF_CPP_MIN_LOG_LEVEL=3 python -m unittest discover -s tests
        language: python
        types: [ python ]
        pass_filenames: false
        verbose: true
        additional_dependencies: [ '--extra-index-url=https://download.pytorch.org/whl/cu132', click, flwr, keras, matplotlib, numpy, pybullet, scipy, torch, tqdm, wandb ]

exclude: '^(.idea/|wandb/|data_generator/baxter_common)'
